name: Build Tailwind CSS

on:
  push:
    branches: [master]
    paths:
      - "src/tailwind.css"
      - "index.html"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build:css

      - name: Commit rebuilt CSS if changed
        run: |
          if ! git diff --quiet -- tailwind.css; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add tailwind.css
            git commit -m "Rebuild tailwind.css [skip ci]"
            git push
          else
            echo "tailwind.css already up to date"
          fi
